/* فهد مبارك — premium RTL personal website */
:root {
  color-scheme: light;
  --ink: #07162f;
  --ink-2: #10254a;
  --ink-3: #284263;
  --blue: #155eef;
  --blue-2: #2e78ff;
  --blue-deep: #0b3aa4;
  --blue-soft: #eaf1ff;
  --sky: #dceaff;
  --white: #ffffff;
  --paper: #f7f9fc;
  --surface: #ffffff;
  --line: #dce3ee;
  --line-strong: #c9d4e4;
  --text: #16243b;
  --muted: #62718a;
  --muted-2: #8491a5;
  --success: #138a60;
  --warning: #ae6500;
  --danger: #c6374f;
  --shadow-xs: 0 2px 7px rgba(7, 22, 47, .06);
  --shadow-sm: 0 8px 24px rgba(7, 22, 47, .08);
  --shadow-md: 0 18px 48px rgba(7, 22, 47, .12);
  --shadow-lg: 0 28px 70px rgba(4, 21, 50, .18);
  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius: 18px;
  --radius-lg: 28px;
  --radius-xl: 38px;
  --max-width: 1200px;
  --ease: cubic-bezier(.2, .75, .25, 1);
}

body[data-theme='dark'] {
  color-scheme: dark;
  --ink: #eaf1ff;
  --ink-2: #c5d7f7;
  --ink-3: #a3b7d7;
  --blue: #6497ff;
  --blue-2: #8ab2ff;
  --blue-deep: #2e78ff;
  --blue-soft: #112a57;
  --sky: #162f5c;
  --white: #ffffff;
  --paper: #09152a;
  --surface: #0e1d35;
  --line: #243858;
  --line-strong: #345073;
  --text: #e7effe;
  --muted: #adbbd1;
  --muted-2: #8193b0;
  --success: #47c99b;
  --warning: #f7b85c;
  --danger: #fb8494;
  --shadow-xs: 0 2px 7px rgba(0, 0, 0, .16);
  --shadow-sm: 0 8px 24px rgba(0, 0, 0, .24);
  --shadow-md: 0 18px 48px rgba(0, 0, 0, .3);
  --shadow-lg: 0 28px 70px rgba(0, 0, 0, .42);
}

* { box-sizing: border-box; }
html { min-width: 320px; scroll-behavior: smooth; scroll-padding-top: 92px; }
body {
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  background: var(--paper);
  color: var(--text);
  direction: rtl;
  font-family: Tahoma, Arial, "Arial Unicode MS", sans-serif;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.8;
  text-align: right;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background-color .25s ease, color .25s ease;
}
body.modal-open { overflow: hidden; }
body.modal-open .site-header { padding-left: 0; }

::selection { background: var(--blue); color: #fff; }
img, svg, video { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
a:not(.btn):not(.nav-link):not(.brand):not(.card-link):not(.section-link):not(.footer-brand):hover { color: var(--blue); }
p, h1, h2, h3, h4, figure { margin-top: 0; }
h1, h2, h3, h4 { color: var(--ink); font-weight: 800; line-height: 1.28; letter-spacing: -.025em; }
p { margin-bottom: 1rem; }
ul, ol { margin: 0; padding-right: 1.2rem; }
button, input, textarea, select { font: inherit; }
button, select { cursor: pointer; }
button { border: 0; }
button:disabled, .btn:disabled { cursor: not-allowed; opacity: .55; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--blue-2); outline-offset: 3px; }

.container {
  width: min(calc(100% - 40px), var(--max-width));
  margin-right: auto;
  margin-left: auto;
}
.icon { width: 1.16em; height: 1.16em; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 14px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

/* Shared controls */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 46px;
  padding: 10px 18px;
  border: 1px solid transparent;
  border-radius: var(--radius-xs);
  font-weight: 700;
  font-size: .92rem;
  line-height: 1.2;
  white-space: nowrap;
  transition: transform .2s var(--ease), box-shadow .2s ease, background-color .2s ease, border-color .2s ease, color .2s ease;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn-primary { background: linear-gradient(135deg, var(--blue-2), var(--blue-deep)); color: #fff; box-shadow: 0 9px 19px rgba(21, 94, 239, .24); }
.btn-primary:hover { color: #fff; box-shadow: 0 13px 25px rgba(21, 94, 239, .32); }
.btn-outline { border-color: var(--line-strong); background: transparent; color: var(--ink); }
.btn-outline:hover { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:hover { background: var(--blue-soft); color: var(--blue); }
.btn-light { background: #fff; color: var(--ink); box-shadow: 0 8px 20px rgba(0, 12, 35, .15); }
.btn-light:hover { background: #eef4ff; color: var(--blue-deep); }
.btn-sm { min-height: 38px; padding: 8px 13px; border-radius: 9px; font-size: .82rem; }
.icon-btn {
  display: inline-grid;
  width: 42px;
  height: 42px;
  padding: 0;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink-2);
  box-shadow: var(--shadow-xs);
  transition: color .2s ease, background-color .2s ease, border-color .2s ease, transform .2s var(--ease);
}
.icon-btn:hover { transform: translateY(-2px); border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.icon-btn .icon { width: 19px; height: 19px; }

/* Header, navigation and search */
.site-header {
  position: sticky;
  z-index: 60;
  top: 0;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.header-inner { display: flex; min-height: 76px; align-items: center; gap: 22px; }
.brand, .footer-brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); }
.brand { flex: 0 0 auto; }
.brand:hover { color: var(--blue); }
.brand-mark {
  display: grid;
  width: 39px;
  height: 39px;
  overflow: hidden;
  place-items: center;
  border-radius: 12px;
  background: linear-gradient(145deg, var(--blue-2), #07308b);
  color: #fff;
  box-shadow: 0 7px 16px rgba(21, 94, 239, .27);
  font-size: 1.1rem;
  font-weight: 800;
}
.brand-mark .icon { width: 22px; height: 22px; }
.brand-copy { display: grid; line-height: 1.22; }
.brand-copy strong { font-size: .98rem; font-weight: 800; }
.brand-copy small { margin-top: 2px; color: var(--muted); font-size: .68rem; font-weight: 500; }
.nav { display: flex; flex: 1; align-items: center; justify-content: center; gap: 3px; }
.nav-link {
  position: relative;
  padding: 10px 11px;
  border-radius: 8px;
  color: var(--muted);
  font-size: .89rem;
  font-weight: 700;
  transition: color .2s ease, background-color .2s ease;
}
.nav-link::after { position: absolute; right: 50%; bottom: 3px; width: 0; height: 2px; border-radius: 4px; background: var(--blue); content: ""; transition: width .22s var(--ease), right .22s var(--ease); }
.nav-link:hover, .nav-link.active { background: var(--blue-soft); color: var(--blue); }
.nav-link.active::after, .nav-link:hover::after { right: 20%; width: 60%; }
.header-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; }
.hamburger { display: none; }
.search-wrap { position: relative; }
.search-wrap .input { width: 100%; min-width: 220px; padding-right: 42px; }
.search-wrap > .icon { position: absolute; top: 50%; right: 14px; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

.sidebar-backdrop { position: fixed; z-index: 79; inset: 0; background: rgba(3, 12, 31, .56); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.sidebar-backdrop.is-open { opacity: 1; pointer-events: auto; }
.sidebar {
  position: fixed;
  z-index: 80;
  top: 0;
  right: 0;
  display: flex;
  width: min(86vw, 340px);
  height: 100dvh;
  padding: 24px;
  flex-direction: column;
  gap: 22px;
  overflow-y: auto;
  border-left: 1px solid var(--line);
  background: var(--surface);
  box-shadow: -18px 0 50px rgba(4, 18, 45, .2);
  transform: translateX(104%);
  transition: transform .32s var(--ease);
}
.sidebar.is-open { transform: translateX(0); }
.sidebar .nav { display: grid; flex: 0; justify-content: stretch; gap: 5px; }
.sidebar .nav-link { padding: 12px 13px; }
.sidebar .nav-link::after { display: none; }
.sidebar .header-actions { margin-top: auto; flex-wrap: wrap; }
.sidebar .btn { flex: 1; }

/* Footer */
.site-footer { margin-top: auto; border-top: 1px solid var(--line); background: var(--surface); }
.footer-grid { display: grid; padding: 56px 0 36px; grid-template-columns: 1.6fr repeat(3, 1fr); gap: 34px; }
.footer-grid h3 { margin-bottom: 13px; font-size: .95rem; }
.footer-grid p { max-width: 360px; color: var(--muted); font-size: .88rem; }
.footer-grid ul { display: grid; padding: 0; gap: 7px; list-style: none; }
.footer-grid li, .footer-grid a { color: var(--muted); font-size: .87rem; }
.footer-grid a:hover { color: var(--blue); }
.footer-brand { margin-bottom: 14px; }
.footer-bottom { display: flex; min-height: 69px; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .78rem; }
.footer-bottom .row { flex-wrap: wrap; gap: 15px; }

/* Feedback and overlays */
.toast-stack { position: fixed; z-index: 110; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); display: grid; width: min(380px, calc(100vw - 36px)); gap: 10px; pointer-events: none; }
.toast { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-right: 4px solid var(--blue); border-radius: 12px; background: var(--surface); color: var(--text); box-shadow: var(--shadow-md); font-size: .88rem; line-height: 1.55; pointer-events: auto; animation: toast-in .35s var(--ease) both; }
.toast .icon { margin-top: 3px; color: var(--blue); }
.toast[data-kind='success'] { border-right-color: var(--success); }
.toast[data-kind='success'] .icon { color: var(--success); }
.toast[data-kind='error'] { border-right-color: var(--danger); }
.toast[data-kind='error'] .icon { color: var(--danger); }
.modal-overlay { position: fixed; z-index: 100; inset: 0; display: grid; padding: 24px; place-items: center; overflow-y: auto; background: rgba(3, 12, 31, .62); opacity: 0; pointer-events: none; transition: opacity .22s ease; }
.modal-overlay.is-open { opacity: 1; pointer-events: auto; }
.modal-box { width: min(100%, 620px); max-height: calc(100dvh - 48px); overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-lg); transform: translateY(14px) scale(.98); transition: transform .27s var(--ease); }
.modal-overlay.is-open .modal-box { transform: translateY(0) scale(1); }
.modal-head { display: flex; min-height: 72px; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
.modal-head h2, .modal-head h3 { margin: 0; font-size: 1.08rem; }
.modal-body { padding: 22px; }
.modal-close { width: 36px; height: 36px; flex: 0 0 auto; }
.progress-bar { position: fixed; z-index: 90; top: 0; right: 0; width: 0; height: 3px; background: linear-gradient(90deg, var(--blue-deep), var(--blue-2), #70a1ff); box-shadow: 0 1px 9px var(--blue); transition: width .15s linear; }
.back-top { position: fixed; z-index: 40; left: 22px; bottom: 22px; width: 45px; height: 45px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--blue); box-shadow: var(--shadow-sm); opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity .2s ease, transform .2s var(--ease), background-color .2s ease; }
.back-top.is-open { opacity: 1; pointer-events: auto; transform: translateY(0); }
.back-top:hover { background: var(--blue); color: #fff; }

/* Sections and hero */
.section { position: relative; padding: 92px 0; }
.section-soft { background: var(--surface); border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 28px; margin-bottom: 38px; }
.section-head > div { max-width: 690px; }
.eyebrow, .hero-overline { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--blue); font-size: .74rem; font-weight: 800; letter-spacing: .08em; }
.eyebrow::before, .hero-overline::before { width: 22px; height: 2px; background: currentColor; content: ""; }
.section-title { margin: 0; font-size: clamp(1.7rem, 3vw, 2.45rem); }
.section-desc { max-width: 660px; margin: 13px 0 0; color: var(--muted); }
.section-link { display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; color: var(--blue); font-weight: 800; font-size: .88rem; }
.section-link .icon { transition: transform .2s var(--ease); }
.section-link:hover .icon { transform: translateX(-4px); }

.hero { position: relative; isolation: isolate; overflow: hidden; color: #f8fbff; background: #061632; }
.hero::before { position: absolute; z-index: -2; inset: 0; background: radial-gradient(circle at 84% 20%, rgba(48, 117, 255, .3), transparent 28%), radial-gradient(circle at 13% 88%, rgba(4, 56, 155, .4), transparent 33%), linear-gradient(117deg, #051228 0%, #071c42 50%, #082a65 100%); content: ""; }
.hero::after { position: absolute; z-index: -1; inset: 0; opacity: .22; background-image: linear-gradient(rgba(171, 204, 255, .09) 1px, transparent 1px), linear-gradient(90deg, rgba(171, 204, 255, .09) 1px, transparent 1px); background-size: 42px 42px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); content: ""; }
.hero-inner { display: grid; min-height: 575px; padding: 92px 0 80px; grid-template-columns: minmax(0, 1.06fr) minmax(390px, .94fr); align-items: center; gap: 58px; }
.hero-copy { position: relative; z-index: 2; max-width: 650px; }
.hero-overline { color: #9fc0ff; }
.hero-overline::before { box-shadow: 0 0 12px currentColor; }
.hero-title { max-width: 620px; margin: 0; color: #fff; font-size: clamp(2.55rem, 5.3vw, 4.9rem); line-height: 1.16; letter-spacing: -.047em; }
.hero-title em { color: #74a4ff; font-style: normal; }
.hero-desc { max-width: 570px; margin: 22px 0 0; color: #ccdaf2; font-size: clamp(.98rem, 1.4vw, 1.1rem); line-height: 2; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 29px; }
.hero-note { display: flex; align-items: center; gap: 8px; margin-top: 20px; color: #adc2e6; font-size: .79rem; }
.hero-note .icon { color: #8ab2ff; }
.hero-visual { position: relative; min-height: 414px; }
.orbit { position: absolute; z-index: 0; border: 1px solid rgba(146, 186, 255, .24); border-radius: 50%; }
.orbit::before, .orbit::after { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #7fadff; box-shadow: 0 0 18px #79a6ff; content: ""; }
.orbit-one { top: 7%; right: 4%; width: 365px; height: 365px; animation: orbit-spin 16s linear infinite; }
.orbit-one::before { top: 21%; right: -4px; }
.orbit-one::after { bottom: 8%; left: 17%; width: 5px; height: 5px; }
.orbit-two { top: 17%; right: 15%; width: 285px; height: 285px; border-style: dashed; animation: orbit-spin 22s linear infinite reverse; }
.orbit-two::before { top: 6%; left: 18%; width: 6px; height: 6px; }
.orbit-two::after { display: none; }
.visual-card { position: absolute; z-index: 2; top: 50%; right: 50%; width: min(100%, 365px); padding: 21px; border: 1px solid rgba(198, 219, 255, .3); border-radius: 22px; background: linear-gradient(145deg, rgba(33, 75, 144, .88), rgba(8, 30, 72, .92)); box-shadow: 20px 30px 55px rgba(0, 5, 18, .32), inset 0 1px 0 rgba(255, 255, 255, .12); transform: translate(50%, -50%) rotate(-4deg); backdrop-filter: blur(10px); }
.visual-card::after { position: absolute; top: 0; right: 25%; width: 33%; height: 1px; background: linear-gradient(90deg, transparent, #8eb6ff, transparent); content: ""; }
.visual-top { display: flex; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid rgba(194, 216, 255, .19); }
.visual-icon { display: grid; width: 46px; height: 46px; place-items: center; border-radius: 13px; background: linear-gradient(145deg, #72a4ff, #1955cf); color: #fff; box-shadow: 0 7px 18px rgba(2, 18, 63, .35); }
.visual-icon .icon { width: 24px; height: 24px; }
.visual-top strong { display: block; color: #fff; font-size: .94rem; }
.visual-top small { display: block; margin-top: 2px; color: #adc6ef; font-size: .7rem; }
.visual-lines { display: grid; gap: 11px; padding: 24px 2px; }
.visual-lines span { display: block; height: 7px; border-radius: 100px; background: linear-gradient(90deg, rgba(139, 181, 255, .85), rgba(110, 155, 238, .17)); }
.visual-lines span:nth-child(2) { width: 82%; }
.visual-lines span:nth-child(3) { width: 61%; }
.visual-bottom { display: flex; align-items: end; justify-content: space-between; padding-top: 15px; border-top: 1px solid rgba(194, 216, 255, .19); color: #c9dbfb; font-size: .72rem; }
.visual-bottom strong { display: block; color: #fff; font-size: 1.35rem; line-height: 1.1; }
.floating-chip { position: absolute; z-index: 3; display: flex; align-items: center; gap: 9px; padding: 9px 12px; border: 1px solid rgba(184, 211, 255, .28); border-radius: 12px; background: rgba(11, 43, 99, .84); color: #dceaff; box-shadow: 0 14px 26px rgba(1, 10, 30, .24); font-size: .7rem; backdrop-filter: blur(10px); }
.floating-chip .icon { color: #83adff; }
.float-one { top: 5%; left: -4%; animation: float 4.5s ease-in-out infinite; }
.float-two { right: 0; bottom: 5%; animation: float 5.4s ease-in-out 1s infinite; }
.hero-metrics { position: relative; z-index: 3; margin-top: -1px; border-top: 1px solid rgba(186, 211, 255, .16); background: rgba(3, 16, 43, .32); }
.metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); }
.metric { display: flex; min-height: 110px; align-items: center; gap: 12px; padding: 22px 27px; border-left: 1px solid rgba(186, 211, 255, .16); }
.metric:last-child { border-left: 0; }
.metric-icon { display: grid; width: 37px; height: 37px; flex: 0 0 auto; place-items: center; border-radius: 10px; background: rgba(101, 154, 255, .16); color: #91b6ff; }
.metric-number { display: block; color: #fff; font-size: 1.38rem; font-weight: 800; line-height: 1.2; }
.metric-label { display: block; margin-top: 3px; color: #aabfdf; font-size: .72rem; }

/* Cards and content catalog */
.section-content { display: grid; gap: 30px; }
.cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.content-card { display: flex; min-width: 0; overflow: hidden; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-xs); transition: transform .25s var(--ease), border-color .25s ease, box-shadow .25s ease; }
.content-card:hover { border-color: color-mix(in srgb, var(--blue) 42%, var(--line)); box-shadow: var(--shadow-md); transform: translateY(-6px); }
.card-cover { position: relative; min-height: 185px; overflow: hidden; background: var(--ink-2); }
.card-cover::before, .card-cover::after { position: absolute; content: ""; }
.card-cover::before { width: 180px; height: 180px; border: 22px solid rgba(255,255,255,.14); border-radius: 50%; bottom: -94px; left: -35px; }
.card-cover::after { top: 25px; right: 28px; width: 86px; height: 9px; border-radius: 100px; background: rgba(255,255,255,.27); box-shadow: 0 20px 0 rgba(255,255,255,.17), 0 40px 0 rgba(255,255,255,.11); }
.cover-news { background: linear-gradient(135deg, #071a42, #1767e8); }
.cover-article { background: linear-gradient(135deg, #0b254d, #16837e); }
.cover-project { background: linear-gradient(135deg, #1b2679, #8256ce); }
.cover-gallery { background: linear-gradient(135deg, #0b315f, #2787d6); }
.card-body { display: flex; flex: 1; flex-direction: column; padding: 19px 19px 17px; }
.card-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: .72rem; }
.card-tag, .badge { display: inline-flex; align-items: center; justify-content: center; padding: 3px 8px; border-radius: 99px; background: var(--blue-soft); color: var(--blue); font-size: .68rem; font-weight: 800; line-height: 1.45; }
.badge { border: 1px solid color-mix(in srgb, var(--blue) 15%, transparent); }
.card-title { margin: 13px 0 8px; font-size: 1.08rem; }
.card-text { margin: 0; color: var(--muted); font-size: .86rem; line-height: 1.85; }
.card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 18px; }
.card-link { display: inline-flex; align-items: center; gap: 6px; color: var(--blue); font-size: .81rem; font-weight: 800; }
.card-link .icon { width: 16px; transition: transform .2s var(--ease); }
.content-card:hover .card-link .icon { transform: translateX(-4px); }
.project-progress { width: 96px; }
.project-progress small { display: block; margin-bottom: 5px; color: var(--muted); font-size: .66rem; }
.progress-track { height: 5px; overflow: hidden; border-radius: 100px; background: var(--line); }
.progress-fill { width: var(--progress, 72%); height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue-deep), var(--blue-2)); }

/* Services and about */
.service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 17px; }
.service-card { position: relative; overflow: hidden; padding: 25px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); transition: border-color .22s ease, transform .22s var(--ease), box-shadow .22s ease; }
.service-card::after { position: absolute; bottom: -55px; left: -36px; width: 130px; height: 130px; border-radius: 50%; background: var(--blue-soft); content: ""; transition: transform .3s var(--ease); }
.service-card:hover { border-color: color-mix(in srgb, var(--blue) 44%, var(--line)); box-shadow: var(--shadow-sm); transform: translateY(-4px); }
.service-card:hover::after { transform: scale(1.3); }
.service-card > * { position: relative; z-index: 1; }
.service-icon { display: grid; width: 48px; height: 48px; margin-bottom: 19px; place-items: center; border-radius: 14px; background: var(--blue-soft); color: var(--blue); }
.service-icon .icon { width: 23px; height: 23px; }
.service-card h3 { margin-bottom: 8px; font-size: 1.06rem; }
.service-card p { margin-bottom: 0; color: var(--muted); font-size: .86rem; }
.about-grid { display: grid; grid-template-columns: .88fr 1.12fr; align-items: center; gap: clamp(38px, 7vw, 90px); }
.about-art { position: relative; min-height: 415px; overflow: hidden; border-radius: var(--radius-lg); background: linear-gradient(145deg, #071a3a, #1254bd); box-shadow: var(--shadow-md); }
.about-art::before { position: absolute; inset: 10% 12%; border: 1px solid rgba(255,255,255,.25); border-radius: 50%; content: ""; }
.about-art::after { position: absolute; top: 14%; right: 18%; width: 62%; height: 62%; border: 18px solid rgba(129, 177, 255, .26); border-radius: 50%; content: ""; }
.about-art > * { position: relative; z-index: 2; }
.about-content .eyebrow { margin-bottom: 8px; }
.about-content .section-title { margin-bottom: 14px; }
.about-content > p { max-width: 640px; color: var(--muted); }
.skill-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px; margin-top: 22px; }
.skill { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 7px; border-bottom: 1px solid var(--line); color: var(--ink-2); font-size: .82rem; font-weight: 700; }
.skill span:last-child { color: var(--blue); font-size: .75rem; }

/* Forms and contact */
.contact-grid { display: grid; grid-template-columns: .85fr 1.15fr; gap: 25px; align-items: stretch; }
.contact-card, .contact-form, .panel, .profile-card, .auth-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-xs); }
.contact-card { padding: 30px; background: linear-gradient(145deg, var(--ink), var(--ink-2)); color: #fff; }
.contact-card h2, .contact-card h3 { color: #fff; }
.contact-card > p { color: #b8c9e5; font-size: .89rem; }
.contact-list { display: grid; gap: 10px; margin-top: 24px; padding: 0; list-style: none; }
.contact-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(205, 222, 250, .15); color: #dce8fa; font-size: .84rem; direction: rtl; }
.contact-item:last-child { border-bottom: 0; }
.contact-item .icon { display: grid; width: 34px; height: 34px; padding: 8px; place-items: center; border-radius: 9px; background: rgba(105, 160, 255, .18); color: #94baff; }
.contact-item a { direction: ltr; unicode-bidi: plaintext; }
.contact-form { padding: 30px; }
.field { display: grid; gap: 7px; }
.field label, .field > span { color: var(--ink-2); font-size: .8rem; font-weight: 800; }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.input, .textarea, select {
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  outline: 0;
  background: var(--surface);
  color: var(--text);
  font-size: .9rem;
  transition: border-color .2s ease, box-shadow .2s ease, background-color .2s ease;
}
.input, select { min-height: 46px; padding: 10px 13px; }
.textarea { display: block; min-height: 134px; padding: 11px 13px; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--muted-2); opacity: 1; }
.input:hover, .textarea:hover, select:hover { border-color: var(--blue); }
.input:focus, .textarea:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 15%, transparent); }
.form-actions { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: 20px; }
.form-actions .muted { font-size: .75rem; }
.check-row { display: flex; align-items: flex-start; gap: 8px; color: var(--muted); font-size: .8rem; line-height: 1.65; }
.check-row input[type='checkbox'] { width: 16px; height: 16px; margin: .33em 0 0; accent-color: var(--blue); }

/* Search, pages and editorial detail */
.search-result { padding: 17px 0; border-bottom: 1px solid var(--line); }
.search-result:first-child { padding-top: 0; }
.search-result:last-child { border-bottom: 0; }
.search-result h3 { margin: 5px 0; font-size: 1.03rem; }
.search-result p { margin: 0; color: var(--muted); font-size: .86rem; }
.page-head { padding: 64px 0 43px; border-bottom: 1px solid var(--line); background: linear-gradient(135deg, var(--surface), var(--blue-soft)); }
.page-head .container { max-width: 950px; }
.page-title { max-width: 800px; margin: 0; font-size: clamp(2rem, 4vw, 3.45rem); }
.page-head p { max-width: 650px; margin: 14px 0 0; color: var(--muted); }
.panel { padding: 24px; }
.notice { display: flex; align-items: flex-start; gap: 11px; padding: 14px 15px; border: 1px solid color-mix(in srgb, var(--blue) 22%, var(--line)); border-radius: 11px; background: var(--blue-soft); color: var(--ink-2); font-size: .84rem; line-height: 1.7; }
.notice .icon { margin-top: 4px; color: var(--blue); }
.empty { display: grid; min-height: 250px; padding: 32px; place-items: center; border: 1px dashed var(--line-strong); border-radius: var(--radius); color: var(--muted); text-align: center; }
.empty .icon { width: 42px; height: 42px; margin: 0 auto 12px; color: var(--blue); }
.rich-body { max-width: 780px; font-size: 1rem; line-height: 2.1; }
.rich-body h2 { margin: 2.2em 0 .65em; font-size: 1.55rem; }
.rich-body h3 { margin: 1.8em 0 .6em; font-size: 1.18rem; }
.rich-body p, .rich-body ul, .rich-body ol { margin-bottom: 1.25em; }
.rich-body li + li { margin-top: .35em; }
.rich-body blockquote { margin: 1.8em 0; padding: 15px 20px; border-right: 4px solid var(--blue); border-radius: 0 10px 10px 0; background: var(--blue-soft); color: var(--ink-2); font-weight: 700; }
.rich-body img { margin: 1.8em 0; border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.rich-body code { padding: .12em .38em; border-radius: 5px; background: var(--blue-soft); color: var(--blue-deep); direction: ltr; unicode-bidi: plaintext; font-family: Consolas, "Courier New", monospace; font-size: .88em; }
.rich-body pre { overflow: auto; padding: 18px; border-radius: 13px; background: var(--ink); color: #e9f1ff; direction: ltr; text-align: left; }

/* Tables */
.table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
table { width: 100%; border-collapse: collapse; color: var(--text); text-align: right; }
th, td { padding: 13px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: .84rem; }
th { background: color-mix(in srgb, var(--blue-soft) 50%, var(--surface)); color: var(--ink-2); font-weight: 800; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background-color .15s ease; }
tbody tr:hover { background: var(--blue-soft); }

/* Admin */
.admin-layout { display: grid; min-height: 100vh; grid-template-columns: 260px 1fr; direction: rtl; }
.admin-side { position: sticky; top: 0; display: flex; height: 100vh; padding: 22px 15px; flex-direction: column; border-left: 1px solid var(--line); background: var(--surface); }
.admin-side .brand { padding: 0 8px; }
.admin-nav { display: grid; gap: 4px; margin-top: 34px; }
.admin-nav a { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 9px; color: var(--muted); font-size: .85rem; font-weight: 700; }
.admin-nav a:hover, .admin-nav a.active { background: var(--blue-soft); color: var(--blue); }
.admin-nav .icon { width: 18px; height: 18px; }
.admin-main { min-width: 0; padding: 0 36px 40px; }
.admin-header { display: flex; min-height: 83px; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; border-bottom: 1px solid var(--line); }
.admin-header h1 { margin: 0; font-size: 1.45rem; }
.admin-card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stat-card { padding: 19px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow-xs); }
.stat-card > .row { justify-content: space-between; }
.stat-card .icon { display: grid; width: 36px; height: 36px; padding: 8px; place-items: center; border-radius: 9px; background: var(--blue-soft); color: var(--blue); }
.stat-card strong { display: block; margin-top: 13px; color: var(--ink); font-size: 1.55rem; line-height: 1.2; }
.stat-card small { color: var(--muted); font-size: .74rem; }
.admin-section { margin-top: 27px; }
.admin-section > h2 { margin: 0 0 16px; font-size: 1.12rem; }
.admin-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 16px; }
.admin-toolbar .search-wrap { width: min(100%, 290px); }

/* Authentication and profiles */
.auth-layout { display: grid; min-height: 100vh; grid-template-columns: minmax(330px, .92fr) minmax(360px, 1.08fr); background: var(--paper); }
.auth-aside { display: flex; padding: clamp(32px, 7vw, 90px); flex-direction: column; justify-content: center; overflow: hidden; background: linear-gradient(145deg, #05142e, #0e4db0); color: #fff; }
.auth-aside .brand { color: #fff; }
.auth-aside h1 { max-width: 540px; margin: 44px 0 14px; color: #fff; font-size: clamp(2rem, 3.7vw, 3.5rem); }
.auth-aside p { max-width: 470px; color: #c3d7fc; }
.auth-card { width: min(calc(100% - 40px), 465px); margin: auto; padding: clamp(25px, 4vw, 42px); box-shadow: var(--shadow-md); }
.auth-card h1, .auth-card h2 { margin-bottom: 7px; font-size: 1.65rem; }
.auth-card > p { margin-bottom: 25px; color: var(--muted); font-size: .88rem; }
.auth-card form { display: grid; gap: 16px; }
.profile-card { padding: 24px; }
.profile-card > .row { align-items: flex-start; }
.profile-card .brand-mark { width: 58px; height: 58px; border-radius: 17px; font-size: 1.45rem; }
.profile-card h2 { margin: 2px 0 3px; font-size: 1.2rem; }
.profile-card p { margin: 0; color: var(--muted); font-size: .84rem; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; min-height: 35px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--muted); font-size: .78rem; font-weight: 700; transition: color .2s ease, border-color .2s ease, background-color .2s ease; }
.chip:hover, .chip.active { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }

/* Gallery */
.gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.gallery-item { position: relative; display: block; min-height: 210px; overflow: hidden; border-radius: 14px; background: linear-gradient(135deg, var(--ink-2), var(--blue)); cursor: zoom-in; }
.gallery-item:nth-child(3n + 2) { background: linear-gradient(135deg, #0b4c69, #2c8cca); }
.gallery-item:nth-child(3n) { background: linear-gradient(135deg, #3b276d, #9a6bd1); }
.gallery-item::before { position: absolute; top: 18%; right: 17%; width: 39%; height: 39%; border: 1px solid rgba(255,255,255,.43); border-radius: 50%; content: ""; transition: transform .35s var(--ease); }
.gallery-item::after { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(2,11,29,.6), transparent 60%); content: ""; }
.gallery-item:hover::before { transform: scale(1.35); }
.gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s var(--ease); }
.gallery-item:hover img { transform: scale(1.06); }
.gallery-item figcaption { position: absolute; z-index: 1; right: 16px; bottom: 13px; left: 16px; color: #fff; font-size: .81rem; font-weight: 800; }
.lightbox { position: fixed; z-index: 120; inset: 0; display: grid; padding: 28px; place-items: center; background: rgba(1, 9, 25, .9); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.lightbox.is-open { opacity: 1; pointer-events: auto; }
.lightbox img { max-width: min(100%, 1150px); max-height: calc(100dvh - 56px); border-radius: 10px; box-shadow: var(--shadow-lg); }
.lightbox .modal-close { position: fixed; top: 18px; left: 18px; border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.1); color: #fff; }

@keyframes orbit-spin { to { transform: rotate(360deg); } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 1020px) {
  .hero-inner { grid-template-columns: minmax(0, 1fr) 370px; gap: 28px; }
  .hero-title { font-size: clamp(2.35rem, 5vw, 3.8rem); }
  .cards-grid, .service-grid { gap: 16px; }
  .admin-card-grid { grid-template-columns: repeat(2, 1fr); }
  .footer-grid { grid-template-columns: 1.5fr repeat(2, 1fr); }
  .footer-grid > :first-child { grid-row: span 2; }
}

@media (max-width: 820px) {
  .container { width: min(calc(100% - 32px), var(--max-width)); }
  .header-inner { min-height: 68px; gap: 10px; }
  .header-inner > .nav, .header-inner > .header-actions .btn { display: none; }
  .header-actions { margin-right: auto; }
  .header-actions .hamburger { display: inline-grid; }
  .hero-inner { min-height: unset; padding: 76px 0 46px; grid-template-columns: 1fr; gap: 35px; }
  .hero-copy { max-width: 670px; }
  .hero-visual { width: min(100%, 500px); min-height: 365px; margin: auto; }
  .visual-card { width: 330px; }
  .metrics-grid { grid-template-columns: repeat(2, 1fr); }
  .metric:nth-child(2) { border-left: 0; }
  .metric:nth-child(-n+2) { border-bottom: 1px solid rgba(186, 211, 255, .16); }
  .metric { min-height: 93px; padding: 18px; }
  .section { padding: 70px 0; }
  .cards-grid { grid-template-columns: repeat(2, 1fr); }
  .service-grid { grid-template-columns: repeat(2, 1fr); }
  .about-grid, .contact-grid { grid-template-columns: 1fr; }
  .about-art { min-height: 330px; max-width: 560px; width: 100%; }
  .footer-grid { grid-template-columns: repeat(2, 1fr); }
  .footer-grid > :first-child { grid-column: 1 / -1; grid-row: auto; }
  .admin-layout { grid-template-columns: 1fr; }
  .admin-side { position: static; height: auto; padding: 13px 16px; border-bottom: 1px solid var(--line); border-left: 0; }
  .admin-side .brand-copy small { display: none; }
  .admin-nav { display: flex; max-width: 100%; margin-top: 12px; overflow-x: auto; }
  .admin-nav a { flex: 0 0 auto; }
  .admin-main { padding: 0 20px 30px; }
  .auth-layout { grid-template-columns: 1fr; }
  .auth-aside { display: none; }
  .auth-card { margin-top: 40px; margin-bottom: 40px; }
}

@media (max-width: 560px) {
  body { font-size: 15px; }
  .container { width: min(calc(100% - 28px), var(--max-width)); }
  .brand-copy small { display: none; }
  .brand-mark { width: 36px; height: 36px; border-radius: 10px; }
  .header-actions { gap: 5px; }
  .icon-btn { width: 38px; height: 38px; }
  .sidebar { padding: 20px; }
  .hero-inner { padding-top: 57px; }
  .hero-title { font-size: clamp(2.25rem, 11vw, 3.25rem); }
  .hero-desc { font-size: .94rem; }
  .hero-actions .btn { width: 100%; }
  .hero-visual { min-height: 315px; transform: scale(.93); transform-origin: center; margin-top: -18px; margin-bottom: -18px; }
  .float-one { left: -9%; }
  .float-two { right: -3%; }
  .metrics-grid { margin: 0 -14px; }
  .metric { padding: 17px 14px; }
  .metric-number { font-size: 1.16rem; }
  .metric-icon { width: 33px; height: 33px; }
  .section { padding: 56px 0; }
  .section-head { display: block; margin-bottom: 26px; }
  .section-link { margin-top: 14px; }
  .cards-grid, .service-grid, .gallery-grid { grid-template-columns: 1fr; }
  .content-card:hover { transform: translateY(-3px); }
  .card-cover { min-height: 164px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-actions { align-items: stretch; flex-direction: column; }
  .form-actions .btn { width: 100%; }
  .contact-card, .contact-form, .panel { padding: 20px; }
  .skill-list { grid-template-columns: 1fr; }
  .footer-grid { padding: 38px 0 26px; gap: 24px; }
  .footer-bottom { align-items: flex-start; padding: 18px 0; flex-direction: column; }
  .page-head { padding: 46px 0 34px; }
  .modal-overlay { padding: 14px; }
  .modal-box { max-height: calc(100dvh - 28px); }
  .modal-head, .modal-body { padding-right: 16px; padding-left: 16px; }
  .admin-main { padding: 0 14px 25px; }
  .admin-header { min-height: 68px; margin-bottom: 20px; }
  .admin-header h1 { font-size: 1.18rem; }
  .admin-card-grid { grid-template-columns: 1fr; }
  .admin-toolbar { align-items: stretch; flex-direction: column; }
  .admin-toolbar .search-wrap { width: 100%; }
  .filters { flex-wrap: nowrap; padding-bottom: 4px; overflow-x: auto; }
  .chip { flex: 0 0 auto; }
  th, td { padding: 11px 13px; }
  .back-top { left: 14px; bottom: 14px; width: 41px; height: 41px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

    readFile(file) { return new Promise((resolve,reject)=>{ if (!file) return resolve(''); if (!file.type.startsWith('image/')) return reject(new Error('اختر صورة صالحة.')); if (file.size>1500000) return reject(new Error('حجم الصورة أكبر من 1.5 ميغابايت.')); const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=()=>reject(new Error('تعذرت قراءة الملف.')); reader.readAsDataURL(file); }); },
    applySettings() { const s=this.store.settings; const p = /^#[0-9a-f]{6}$/i.test(s.primary||'') ? s.primary : '#2458ef'; document.documentElement.style.setProperty('--primary',p); document.documentElement.style.setProperty('--blue',p); document.documentElement.style.setProperty('--blue-2',p); document.documentElement.style.setProperty('--blue-deep',p); document.title=(s.siteName||'فهد مبارك')+' | المساحة الرقمية'; },

  const nav = [['home','الرئيسية'],['news','الأخبار'],['articles','المقالات'],['projects','المشاريع'],['gallery','معرض الأعمال'],['services','الخدمات'],['about','من أنا'],['contact','تواصل معي']];

  function toggleTheme(){ document.body.dataset.theme = document.body.dataset.theme==='dark'?'light':'dark'; try {localStorage.setItem('fahad_theme',document.body.dataset.theme);} catch {} header(cleanRoute()); FM.toast(document.body.dataset.theme==='dark'?'تم تفعيل الوضع الداكن.':'تم تفعيل الوضع الفاتح.'); }

  function services(limit=3){const list=displayed('service').slice(0,limit);return list.length?`<div class="service-grid">${list.map((it,i)=>`<article class="service-card"><div class="service-icon">${icons(['code','layout','layers','bolt'][i%4])}</div><span class="service-index">0${i+1}</span><h3>${esc(it.title)}</h3><p>${esc(it.summary||'')}</p><a href="#contact" class="service-link">لنتحدث ${icons('arrow-left')}</a></article>`).join('')}</div>`:'<div class="empty">لا توجد خدمات مضافة حاليًا.</div>';}

  function stats(){ const all=FM.store.items; const vals=[[all.filter(x=>x.type==='news'&&x.status==='published').length,'خبر','file'],[all.filter(x=>x.type==='article'&&x.status==='published').length,'مقال','edit'],[all.filter(x=>x.type==='project'&&x.status==='published').length,'مشروع','layers'],[all.filter(x=>x.type==='gallery'&&x.status==='published').length,'عمل','grid']];return `<div class="hero-metrics"><div class="container metrics-grid">${vals.map(([v,l,i])=>`<div class="metric"><span class="metric-icon">${icons(i)}</span><span><strong class="metric-number">${v.toLocaleString('ar-SA')}</strong><small class="metric-label">${l} منشور</small></span></div>`).join('')}<div class="metric metric-note"><span class="metric-icon">${icons('spark')}</span><span><strong>مساحة تتجدد</strong><small class="metric-label">أفكار ومحتوى في مكان واحد</small></span></div></div></div>`;}

  function listing(type){ return `${pageHead(names[type],titles[type],descriptions[type])}<section class="section"><div class="container"><div class="filters"><label class="filter-search">${icons('search')}<input type="search" id="list-search" placeholder="ابحث في ${names[type]}" aria-label="بحث"></label><select id="list-sort" aria-label="ترتيب النتائج"><option value="new">الأحدث أولًا</option><option value="old">الأقدم أولًا</option><option value="name">الاسم</option></select></div><div id="list-result">${type==='gallery'?gallery(999):type==='service'?services(999):cards(type,999)}</div></div></section>`; }
  function aboutPage(){return `${pageHead('من أنا','أهلًا، أنا فهد مبارك','مساحة أتحدث فيها عن الأفكار التي أحبها وما أصنعه في العالم الرقمي.')}<div class="about-page">${aboutSection()}<div class="container about-extra"><div><span class="eyebrow"><span></span> ما يجمعنا</span><h2>الأفكار تبدأ بخطوة.</h2><p>أؤمن بأن وضوح الفكرة والاهتمام بالتفاصيل هما بداية كل تجربة تستحق المشاركة. هذا الموقع مساحة شخصية تنمو مع كل فكرة جديدة.</p></div><a href="#contact" class="btn btn-primary">لنتواصل ${icons('arrow-left')}</a></div></div>`;}
  function contactPage(){const s=FM.store.settings;return `${pageHead('تواصل معي','لنصنع شيئًا مميزًا معًا.','لديك استفسار أو فكرة؟ اختر الطريقة الأنسب للتواصل.')}<section class="section"><div class="container contact-grid"><div class="contact-card"><span class="eyebrow"><span></span> وسائل التواصل</span><h2>يسعدني تواصلك</h2><p class="muted">اختر وسيلة التواصل المناسبة لك، أو اكتب رسالتك في النموذج المجاور.</p><div class="contact-list"><div class="contact-item"><span>${icons('mail')}</span><div><small>البريد الإلكتروني</small>${s.email?`<a href="mailto:${esc(s.email)}">${esc(s.email)}</a>`:'<b>يمكن إضافته من الإعدادات</b>'}</div></div>${s.x?`<div class="contact-item"><span>𝕏</span><div><small>حساب X</small><b>${esc(s.x)}</b></div></div>`:''}${s.snapchat?`<div class="contact-item"><span>◉</span><div><small>Snapchat</small><b>${esc(s.snapchat)}</b></div></div>`:''}</div></div><form class="panel contact-form" id="contact-form"><h2>أرسل رسالة</h2><p class="muted">املأ البيانات وسنجهز الرسالة في تطبيق البريد لديك.</p><div class="form-grid"><label class="field">الاسم<input class="input" name="name" required maxlength="100" placeholder="اسمك الكريم"></label><label class="field">البريد الإلكتروني<input class="input" name="email" type="email" required maxlength="120" placeholder="name@example.com" dir="ltr"></label><label class="field field-full">الموضوع<input class="input" name="subject" required maxlength="150" placeholder="ما موضوع رسالتك؟"></label><label class="field field-full">الرسالة<textarea class="input" name="message" rows="5" required maxlength="3000" placeholder="أخبرني بالمزيد..."></textarea></label></div><button class="btn btn-primary" type="submit">فتح تطبيق البريد ${icons('arrow-left')}</button><p class="form-note">يُفتح تطبيق البريد على جهازك؛ لن تُرسل الرسالة تلقائيًا.</p></form></div></section>`;}
  function legal(kind){const p=kind==='privacy',t=p?'سياسة الخصوصية':'الشروط والأحكام',c=p?FM.store.settings.privacyText:FM.store.settings.termsText;
    const def=p?`<h2>خصوصيتك مهمة</h2><p>نجمع الحد الأدنى من البيانات اللازمة لتشغيل حسابك: الاسم واسم المستخدم والبريد الإلكتروني، ورقم الجوال إن أضفته. لا نبيع بياناتك ولا نشاركها مع أطراف أخرى.</p><h3>كلمة المرور</h3><p>تُخزَّن كلمة المرور مشفّرة ولا تُحفظ كنص صريح.</p><h3>ما تنشره</h3><p>المقالات والتعليقات والمشاركات التي تنشرها تظهر للزوار باسمك.</p><h3>التواصل</h3><p>لأي استفسار أو طلب بخصوص بياناتك استخدم صفحة التواصل.</p>`:`<h2>شروط الاستخدام</h2><p>باستخدامك الموقع فإنك توافق على هذه الشروط.</p><h3>السلوك والمحتوى</h3><p>يُمنع نشر ما يخالف الأنظمة أو يسيء للآخرين أو ينتهك حقوق الملكية الفكرية. للمالك والمحررين مراجعة المقالات والتعليقات وإخفاء ما يخالف الشروط.</p><h3>المقالات والمشاركات</h3><p>تبقى حقوق المقال لكاتبه، ويمنح الموقع حق عرضه ضمن المنصة.</p><h3>الحسابات</h3><p>أنت مسؤول عن سرية بيانات دخولك، ويحق للمالك إيقاف أي حساب يخالف الشروط.</p>`;
    return `${pageHead(t,t,'معلومات مهمة حول استخدام الموقع.')}<section class="section"><div class="container legal-wrap"><div class="panel rich-body">${c?esc(c).split('\\n').filter(Boolean).map(x=>`<p>${x}</p>`).join(''):def}</div></div></section>`;}
  function details(id){const item=FM.store.items.find(x=>x.id===id&&x.status==='published');if(!item)return notfound();const type=item.type;return `${pageHead(names[type]||'المحتوى',item.title,item.summary||'')}<section class="section"><div class="container detail-layout"><article class="panel detail-card">${artCover(item,1)}<div class="detail-meta"><span>${icons('user')} ${esc(item.author||'فهد مبارك')}</span><span>${icons('calendar')} ${date(item.createdAt)}</span><span class="card-tag">${esc(item.category||'')}</span></div><div class="rich-body">${esc(item.body||item.summary||'').split('\n').filter(Boolean).map(p=>`<p>${p}</p>`).join('') || '<p>لا يوجد وصف إضافي.</p>'}</div>${type==='project'?`<div class="project-progress"><span>نسبة الإنجاز <b>${Number(item.progress)||0}%</b></span><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,Math.max(0,Number(item.progress)||0))}%"></div></div></div>`:''}<div class="detail-actions"><button class="btn btn-outline" id="share-item">${icons('share')} مشاركة</button><button class="btn btn-outline" id="fav-item" data-id="${esc(item.id)}">${icons('bookmark')} حفظ في المفضلة</button><a class="btn btn-ghost" href="#${typeRoutes[type]||'home'}">العودة للقائمة</a></div></article><aside class="panel detail-aside"><span class="eyebrow"><span></span> شارك الفكرة</span><h3>تجربة تستحق المشاركة.</h3><p>يمكنك نسخ الرابط والعودة إلى المزيد من المحتوى.</p><a href="#contact" class="section-link">تواصل معي ${icons('arrow-left')}</a></aside></div><div class="container comments-wrap"><div class="panel"><h2>التعليقات <span class="muted">(${FM.store.comments.filter(x=>x.itemId===item.id).length})</span></h2><p class="muted">التعليقات محفوظة في حسابك وتظهر على أجهزتك بعد تسجيل الدخول.</p><div id="comments-list">${FM.store.comments.filter(x=>x.itemId===item.id).map(x=>`<div class="comment"><b>${esc(x.author||'عضو')}</b><small>${date(x.date)}</small><p>${esc(x.text)}</p></div>`).join('')||'<p class="muted">لا توجد تعليقات بعد.</p>'}</div>${FM.user()?`<form id="comment-form" data-id="${esc(item.id)}"><label class="field">أضف تعليقًا<textarea class="input" name="comment" required maxlength="1000" rows="3" placeholder="اكتب تعليقك هنا..."></textarea></label><button class="btn btn-primary btn-sm">إضافة تعليق</button></form>`:'<a href="#login" class="btn btn-outline btn-sm">سجل الدخول للتعليق</a>'}</div></div></section>`;}
  function notfound(){return `${pageHead('404','الصفحة غير موجودة','عذرًا، الصفحة التي تبحث عنها غير متوفرة أو ربما تم نقلها.')}<section class="section"><div class="container"><div class="empty empty-404"><strong>404</strong><p>لنعد بك إلى مكان مألوف.</p><a href="#home" class="btn btn-primary">العودة للرئيسية ${icons('arrow-left')}</a></div></div></section>`;}
  function searchModal(){FM.showModal('البحث في الموقع',`<label class="field search-modal-label">ابحث عن خبر أو مقال أو مشروع<input class="input" id="global-search" type="search" placeholder="اكتب كلمة للبحث..." autocomplete="off"></label><div id="search-results" class="search-results"><p class="muted">ابدأ الكتابة لعرض النتائج.</p></div>`);const input=$('#global-search');input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase();const list=q?FM.store.items.filter(x=>x.status==='published' && `${x.title} ${x.summary} ${x.category} ${x.body}`.toLowerCase().includes(q)).slice(0,15):[];$('#search-results').innerHTML=!q?'<p class="muted">ابدأ الكتابة لعرض النتائج.</p>':list.length?list.map(x=>`<a class="search-result" href="#item/${encodeURIComponent(x.id)}"><span>${icons('file')}</span><div><b>${esc(x.title)}</b><small>${esc(names[x.type]||'محتوى')} · ${esc(x.summary||'')}</small></div>${icons('arrow-left')}</a>`).join(''):'<p class="muted">لا توجد نتائج مطابقة.</p>'; $$('#search-results a').forEach(a=>a.addEventListener('click',()=>FM.closeModal()));});}
  function galleryModal(id){const list=displayed('gallery');let idx=list.findIndex(x=>x.id===id);if(idx<0)return;function draw(){const item=list[idx];let zoom=1;FM.showModal(item.title,`<div class="lightbox"><div class="lightbox-stage">${artCover(item,idx)}</div><p>${esc(item.summary||'')}</p><div class="actions"><button class="btn btn-outline btn-sm" id="gallery-prev">السابق</button><span class="muted">${idx+1} / ${list.length}</span><button class="btn btn-outline btn-sm" id="gallery-next">التالي</button><button class="btn btn-outline btn-sm" id="gallery-zoom-in" aria-label="تكبير">تكبير +</button><button class="btn btn-outline btn-sm" id="gallery-zoom-out" aria-label="تصغير">تصغير −</button></div></div>`);$('#gallery-prev').addEventListener('click',()=>{idx=(idx-1+list.length)%list.length;draw();});$('#gallery-next').addEventListener('click',()=>{idx=(idx+1)%list.length;draw();});$('#gallery-zoom-in').addEventListener('click',()=>{$('.lightbox-stage .card-cover').style.transform=`scale(${zoom=Math.min(2.5,zoom+0.25)})`;});$('#gallery-zoom-out').addEventListener('click',()=>{$('.lightbox-stage .card-cover').style.transform=`scale(${zoom=Math.max(1,zoom-0.25)})`;});}draw();}
  function bindPublic(route){
    $$('[data-gallery]').forEach(el=>el.addEventListener('click',()=>galleryModal(el.dataset.gallery)));
    const search=$('#list-search'), sort=$('#list-sort');
    if(search&&sort){const type=({news:'news',articles:'article',projects:'project',gallery:'gallery',services:'service'})[route]||({achievements:'achievement',notes:'note'})[route];const update=()=>{let list=displayed(type);const q=search.value.trim().toLowerCase();if(q)list=list.filter(x=>`${x.title} ${x.summary} ${x.category}`.toLowerCase().includes(q));if(sort.value==='old')list.reverse();if(sort.value==='name')list.sort((a,b)=>a.title.localeCompare(b.title,'ar'));const result=$('#list-result');if(!list.length){result.innerHTML='<div class="empty">لا توجد نتائج مطابقة.</div>';return;}if(type==='service')result.innerHTML=`<div class="service-grid">${list.map((x,i)=>`<article class="service-card"><div class="service-icon">${icons(['code','layout','layers'][i%3])}</div><h3>${esc(x.title)}</h3><p>${esc(x.summary||'')}</p><a href="#contact" class="service-link">لنتحدث ${icons('arrow-left')}</a></article>`).join('')}</div>`;else if(type==='gallery'){result.innerHTML=`<div class="gallery-grid">${list.map((x,i)=>`<button class="gallery-item" data-gallery="${esc(x.id)}" aria-label="عرض ${esc(x.title)}">${artCover(x,i)}<span class="gallery-label"><b>${esc(x.title)}</b><small>${esc(x.category||'')}</small></span></button>`).join('')}</div>`;$$('[data-gallery]',result).forEach(el=>el.addEventListener('click',()=>galleryModal(el.dataset.gallery)));}else result.innerHTML=`<div class="cards-grid">${list.map(card).join('')}</div>`;};search.addEventListener('input',update);sort.addEventListener('change',update);}
    $('#contact-form')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget), s=FM.store.settings; if(!s.email){FM.toast('أضف البريد الإلكتروني في الإعدادات أولًا.',true);return;}const subject=f.get('subject');const body=`الاسم: ${f.get('name')}\nالبريد: ${f.get('email')}\n\n${f.get('message')}`;FM.toast('تم تجهيز الرسالة في تطبيق البريد.');window.location.href=`mailto:${encodeURIComponent(s.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;});
    $('#share-item')?.addEventListener('click',async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);FM.toast('تم نسخ الرابط.');}else throw new Error();}catch(e){if(e.name!=='AbortError')FM.showModal('رابط المحتوى',`<p class="muted">انسخ الرابط من الحقل التالي:</p><input class="input" value="${esc(location.href)}" readonly onclick="this.select()">`);}});
    $('#fav-item')?.addEventListener('click',e=>{const user=FM.user();if(!user){FM.toast('سجل الدخول أولًا لإضافة المفضلة.',true);return;}const id=e.currentTarget.dataset.id;const existing=FM.store.favorites.find(x=>x.userId===user.id&&x.itemId===id);if(existing){FM.store.favorites=FM.store.favorites.filter(x=>x!==existing);FM.toast('تمت الإزالة من المفضلة.');}else{FM.store.favorites.push({userId:user.id,itemId:id});FM.toast('تمت الإضافة إلى المفضلة.');}FM.save();});
    $('#comment-form')?.addEventListener('submit',e=>{e.preventDefault();const user=FM.user(),text=new FormData(e.currentTarget).get('comment').trim();if(!user||!text)return;FM.store.comments.push({id:uid(),itemId:e.currentTarget.dataset.id,userId:user.id,author:user.name,text,date:new Date().toISOString()});FM.log('إضافة تعليق');FM.toast('تمت إضافة تعليقك.');FM.refresh();});
  }
  function addProfileFavorites(){
    const user=FM.user(),root=$('[data-route="profile"]');
    if(!user||!root)return;
    const favs=FM.store.favorites.filter(x=>x.userId===user.id).map(x=>FM.store.items.find(it=>it.id===x.itemId&&it.status==='published')).filter(Boolean);
    const panel=document.createElement('section');panel.className='panel profile-favorites';
    panel.innerHTML=`<h2>المفضلة</h2><p class="muted">العناصر التي حفظتها للرجوع إليها.</p>${favs.length?`<div class="favorites-list">${favs.map(x=>`<div class="favorite-row"><a href="#item/${encodeURIComponent(x.id)}">${esc(x.title)}</a><button class="btn btn-outline btn-sm" type="button" data-remove-favorite="${esc(x.id)}">إزالة</button></div>`).join('')}</div>`:'<p class="muted">لا توجد عناصر في المفضلة حتى الآن.</p>'}`;
    root.querySelector('section.container')?.append(panel);
    $$('[data-remove-favorite]',panel).forEach(btn=>btn.addEventListener('click',()=>{FM.store.favorites=FM.store.favorites.filter(x=>!(x.userId===user.id&&x.itemId===btn.dataset.removeFavorite));FM.save();FM.toast('تمت الإزالة من المفضلة.');FM.refresh();}));
  }
  window.FMXH={card,cards,sectionHead,displayed,pageHead,listing,date:FM.date,titles,descriptions,names};
  function render(scroll=true){
    const route=cleanRoute();FM.applySettings();header(route);sidebar();footer();const view=$('#view');
    const adminRoutes=['login','register','setup','profile','admin','forgot'];
    if(adminRoutes.includes(route) && window.FMAdmin){view.innerHTML=FMAdmin.render(route);FMAdmin.bind(route);}
    else if(route==='home'||route==='')view.innerHTML=home();
    else if(route==='news')view.innerHTML=listing('news');
    else if(route==='articles')view.innerHTML=FMX.route('articles');
    else if(route==='projects')view.innerHTML=listing('project');
    else if(route==='gallery')view.innerHTML=listing('gallery');
    else if(route==='services')view.innerHTML=listing('service');
    else if(window.FMX&&FMX.route(route)!=null)view.innerHTML=FMX.route(route);
    else if(route==='about')view.innerHTML=aboutPage();
    else if(route==='contact')view.innerHTML=contactPage();
    else if(route==='terms'||route==='privacy')view.innerHTML=legal(route);
    else if(route.startsWith('item/'))view.innerHTML=details(route.slice(5));
    else view.innerHTML=notfound();
    if(route==='profile')addProfileFavorites();
    bindPublic(route);window.FMX&&FMX.after(route);if(scroll)window.scrollTo({top:0,behavior:'auto'});
  }
  window.addEventListener('hashchange',()=>render());
  window.addEventListener('scroll',()=>{const doc=document.documentElement;const max=doc.scrollHeight-doc.clientHeight;$('#scroll-progress').style.width=(max>0?window.scrollY/max*100:0)+'%';$('#back-top').classList.toggle('is-open',window.scrollY>500);},{passive:true});
  window.addEventListener('keydown',e=>{if(e.key==='Escape'){FM.closeModal();closeDrawer();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal();}});
  $('#sidebar-backdrop').addEventListener('click',closeDrawer);
  $('#modal-close').addEventListener('click',()=>FM.closeModal());
  $('#modal').addEventListener('click',e=>{if(e.target===e.currentTarget)FM.closeModal();});
  $('#back-top').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  try {document.body.dataset.theme=localStorage.getItem('fahad_theme')||'light';}catch{document.body.dataset.theme='light';}
  // Render after both inline modules have been parsed.
  document.addEventListener('DOMContentLoaded',()=>render());
})();

  </script>
  <script>
/*
 * FMAdmin — local-only admin, CMS and authentication UI for a single-file RTL site.
 * It intentionally relies only on the window.FM contract supplied by the parent page.

 */
(function (window, document) {
  'use strict';

  var FM = window.FM;
  var state = { tab: 'dashboard', itemType: 'all', itemStatus: 'all', query: '' };
  var TYPES = ['news', 'article', 'project', 'gallery', 'service', 'achievement', 'timeline', 'note', 'library', 'faq'];
  var STATUS = ['published', 'pending', 'draft', 'archived', 'trash'];
  var CONSULTATION_CATEGORIES = ['general', 'content', 'technical', 'account', 'other'];
  var consultationCategoryNames = { general: 'استشارة عامة', content: 'محتوى الموقع', technical: 'مشكلة تقنية', account: 'الحساب', other: 'أخرى' };
  var consultationStatusNames = { pending: 'قيد المراجعة', replied: 'تم الرد', closed: 'مغلق' };
  var typeNames = { news: 'أخبار', article: 'مقالات', project: 'مشاريع', gallery: 'معرض', service: 'خدمات', achievement: 'إنجازات', timeline: 'محطات الرحلة', note: 'مذكرات', library: 'مكتبة', faq: 'أسئلة شائعة' };
  var statusNames = { published: 'منشور', pending: 'بانتظار المراجعة', draft: 'مسودة', archived: 'مؤرشف', trash: 'سلة المحذوفات' };

  function injectStyles() {
    if (document.getElementById('fm-admin-styles')) return;
    var css = `
      #fm-admin-styles { display:none; }
      .fm-admin-app{direction:rtl;color:#172033;font-family:'IBM Plex Sans Arabic',Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.65;max-width:1180px;margin:0 auto;padding:26px 18px;box-sizing:border-box}
      .fm-admin-app *{box-sizing:border-box}.fm-admin-app button,.fm-admin-app input,.fm-admin-app textarea,.fm-admin-app select{font:inherit}
      .fm-admin-app .container{max-width:1100px;margin:auto}.fm-admin-app .section{padding:10px 0}.fm-admin-app .eyebrow{display:inline-flex;gap:7px;align-items:center;color:#2458ef;font-weight:800;font-size:.8rem;letter-spacing:.02em}.fm-admin-app .eyebrow:before{content:"";width:18px;height:2px;background:#5684f4}

const tabs=[['all','الكل',all.length],['site','مقالات الموقع',off.length],['members','مقالات الأعضاء',com.length],...(u?[['mine','مقالاتي',mine.length]]:[])];

const bindArticles=()=>$$('[data-fx-tab]').forEach(b=>b.addEventListener('click',()=>{$$('[data-fx-tab]').forEach(x=>x.classList.toggle('active',x===b));$$('[data-fx-pane]').forEach(p=>p.hidden=p.dataset.fxPane!==b.dataset.fxTab)}));
const write=id=>{const u=me(),head=H.pageHead('اكتب مقالًا','اكتب مقالًا','شارك فكرة أو تجربة مع زوار الموقع.');
if(!u)return head+sec(`<div class="notice">${ic('info')}<span>سجّل الدخول لكتابة مقال. <a href="#login">تسجيل الدخول</a> · <a href="#register">إنشاء حساب</a></span></div>`);
const x=id?S().items.find(i=>i.id===id&&i.authorId===u.id):null;if(id&&!x)return H.pageHead('غير متاح','المقال غير متاح','لا يمكنك تعديل هذا المقال.');
return head+sec(`<form class="panel" id="fx-write" style="max-width:820px"><div class="form-grid"><label class="field" style="grid-column:1/-1"><span>العنوان *</span><input class="input" name="title" maxlength="160" required value="${esc(x?.title||'')}"></label><label class="field" style="grid-column:1/-1"><span>ملخص قصير</span><input class="input" name="summary" maxlength="240" value="${esc(x?.summary||'')}"></label><label class="field"><span>التصنيف</span><input class="input" name="category" maxlength="40" value="${esc(x?.category||'')}"></label><label class="field"><span>صورة الغلاف</span><input class="input" type="file" name="img" accept="image/png,image/jpeg,image/webp"></label><label class="field" style="grid-column:1/-1"><span>نص المقال *</span><textarea class="textarea" name="body" style="min-height:300px" required>${esc(x?.body||'')}</textarea></label></div><p class="muted">${staff()?'مقالاتك تُنشر مباشرة.':'تُراجَع المقالات قبل نشرها، وتجد حالتها في «مقالاتي».'}</p><div class="form-actions"><button class="btn btn-outline" name="act" value="draft">حفظ كمسودة</button><button class="btn btn-primary" name="act" value="go">${staff()?'نشر المقال':'إرسال للمراجعة'}</button></div></form>`)};
const bindWrite=id=>$('#fx-write')?.addEventListener('submit',async e=>{e.preventDefault();const u=me(),f=e.currentTarget,g=n=>f.elements[n],act=e.submitter?.value||'go',title=g('title').value.trim(),body=g('body').value.trim();
if(!u)return;if(title.length<3)return FM.toast('اكتب عنوانًا واضحًا.',true);if(act!=='draft'&&body.length<30)return FM.toast('نص المقال قصير جدًا.',true);
let img='';try{if(g('img').files[0])img=await FM.readFile(g('img').files[0])}catch(er){return FM.toast(er.message,true)}
let x=id?S().items.find(i=>i.id===id&&i.authorId===u.id):null;if(!x){x={id:FM.uid(),type:'article',createdAt:iso(),author:u.name||u.username,authorId:u.id,by:staff()?'site':'member',progress:0,image:''};S().items.push(x)}
Object.assign(x,{title,summary:g('summary').value.trim(),category:g('category').value.trim(),body,updatedAt:iso(),status:act==='draft'?'draft':staff()?'published':'pending'});if(img)x.image=img;
FM.log((act==='draft'?'حفظ مسودة مقال: ':'إرسال مقال: ')+title);FM.save();FM.toast(act==='draft'?'تم حفظ المسودة.':staff()?'تم نشر المقال.':'وصل مقالك وسيُراجع قبل النشر.');FM.navigate('articles')});
/* واجهة FMX */
window.FMX={
routes:RT,
heroPanel(){const l=S().items.filter(x=>x.status==='published'&&!String(x.id).startsWith('sample-')).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,4),q=[['projects','المشاريع'],['articles','المقالات'],['community','المجتمع'],['contact','تواصل']];
return`<div class="hero-visual fx-hp"><div class="fx-hpc"><h2>آخر ما نُشر</h2>${l.length?l.map(x=>`<a class="fx-hi" href="#item/${encodeURIComponent(x.id)}"><small>${esc(H.names[x.type]||'')} · ${H.date(x.createdAt)}</small><b>${esc(x.title)}</b></a>`).join(''):`<p style="color:#adc2e6;margin:0">لا يوجد محتوى منشور بعد${staff()?'. أضف أول محتوى من لوحة الإدارة.':'.'}</p>`}<div class="fx-hq">${q.map(([r,n])=>`<a href="#${r}">${n}</a>`).join('')}</div></div></div>`},
keepOrder(old,n7){const full=(Array.isArray(old)?old.filter(k=>ALL.includes(k)):[]);ALL.forEach(k=>{if(!full.includes(k))full.push(k)});const f=[...new Set(full)],idx=f.map((k,i)=>n7.includes(k)?i:-1).filter(i=>i>=0);idx.forEach((i,j)=>f[i]=n7[j]);return f},
extra(item,fd){item.x_year=String(fd.get('x_year')||'').trim().slice(0,40);const u=String(fd.get('x_url')||'').trim();item.x_url=url(u);const dd=String(fd.get('x_data')||'');if(dd.length<900000&&/^data:[\w.+\/-]+;base64,[A-Za-z0-9+\/=]+$/.test(dd)){item.x_data=dd;item.x_fname=String(fd.get('x_fname')||'file').slice(0,80)}if(fd.get('x_rm')){delete item.x_data;delete item.x_fname}}, 
tab(n){return({sections:tSections,notifications:tNotices,stats:tStats})[n]()},
home(k){const l=pub(k);if(!l.length)return'';const b=k==='timeline'?tl(l.slice(0,6)):k==='faq'?faq(l.slice(0,6)):k==='library'?lib(l.slice(0,4)):`<div class="cards-grid">${l.slice(0,3).map(H.card).join('')}</div>`;return`<section class="section ${['article','library'].includes(k)?'section-soft':''}"><div class="container">${H.sectionHead(k)}${b}</div></section>`},
route(r){if(r==='articles')return articles();if(r==='write'||r.startsWith('write/'))return write(r.slice(6));if(r==='community')return community();if(r==='notifications')return notifs();const t=RT[r];if(!NEW.includes(t))return null;
if(!shown(t)&&!staff())return H.pageHead(LBL[t],LBL[t],'هذا القسم غير متاح حاليًا.')+sec(empty('هذا القسم مخفي مؤقتًا.'));
const l=pub(t);if(t==='timeline'||t==='faq'||t==='library')return H.pageHead(LBL[t],H.titles[t],H.descriptions[t])+sec(l.length?(t==='timeline'?tl(l):t==='faq'?faq(l):lib(l)):empty('لا يوجد محتوى منشور في هذا القسم بعد.'));return H.listing(t)},
after(r){
if(['login','register'].includes(r)&&me())return FM.navigate('profile');
if(['login','register','forgot'].includes(r)){$('.fm-admin-app .panel')?.insertAdjacentHTML('afterbegin','<a class="fx-back" href="#home">العودة إلى الموقع</a><div class="fx-ab"><span class="brand-mark">F<span>.</span></span><strong>'+esc(FM.store.settings.siteName)+'</strong></div>')}
if(r==='profile')profile();if(r==='articles')bindArticles();if(r==='write'||r.startsWith('write/'))bindWrite(r.slice(6));
if(r==='community'){$$('.fx-reply').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();const u=me(),p=S().posts.find(x=>x.id===f.dataset.pid),t=f.t.value.trim();if(!u||!p||!t)return;(p.replies=p.replies||[]).push({id:FM.uid(),userId:u.id,name:u.name||u.username,t:t.slice(0,300),createdAt:iso()});FM.log('رد في المجتمع');FM.save();FM.refresh()}));$('#fx-post')?.addEventListener('submit',e=>{e.preventDefault();const u=me(),t=e.currentTarget.t.value.trim();if(!u||!t)return;S().posts.push({id:FM.uid(),userId:u.id,name:u.name||u.username,t:t.slice(0,500),createdAt:iso()});FM.log('نشر مشاركة في المجتمع');FM.save();FM.refresh()})}
if(r==='notifications'){try{localStorage.setItem('fahad_reads',JSON.stringify(vis().map(n=>n.id)))}catch{}badge()}
if(r.startsWith('item/'))itemExtra(r.slice(5));
if(!['admin','login','register','setup','forgot'].includes(r)){const v=S().views;v[r]=(v[r]||0)+1;clearTimeout(window.__fxv);window.__fxv=setTimeout(()=>FM.save(),1500)}},
click(a,b,id){if(!/^(sec-|notice-)/.test(a))return false;if(!own()){FM.toast('هذه العملية للمالك فقط.',true);return true}
const st=FM.store.settings;
if(a==='sec-toggle'){st.visible=st.visible||{};st.visible[id]=st.visible[id]===false;FM.log('تبديل ظهور قسم: '+LBL[id])}
if(a==='sec-up'||a==='sec-down'){const o=order(),i=o.indexOf(id),j=a==='sec-up'?i-1:i+1;if(i<0||j<0||j>=o.length)return true;[o[i],o[j]]=[o[j],o[i]];st.sectionOrder=o;FM.log('تغيير ترتيب قسم: '+LBL[id])}
if(a==='notice-del'){if(!confirm('حذف هذا الإشعار؟'))return true;S().notifications=S().notifications.filter(n=>n.id!==id);FM.log('حذف إشعار')}
FM.save();FM.refresh();return true},
submit(k,f){if(!['design','notice'].includes(k))return;if(!own())return FM.toast('هذه العملية للمالك فقط.',true);const d=new FormData(f);
if(k==='design'){const st=FM.store.settings,c=String(d.get('primary'));if(/^#[0-9a-f]{6}$/i.test(c))st.primary=c;st.radius=['soft','sharp','round'].includes(d.get('radius'))?d.get('radius'):'soft';FM.applySettings();applyRadius();FM.log('تحديث تصميم الموقع');FM.toast('تم حفظ التصميم.')}
if(k==='notice'){const t=String(d.get('title')).trim();if(!t)return FM.toast('أدخل عنوان الإشعار.',true);S().notifications.push({id:FM.uid(),title:t.slice(0,120),text:String(d.get('text')).trim().slice(0,600),aud:d.get('aud')==='members'?'members':'all',createdAt:iso()});FM.log('نشر إشعار: '+t);FM.toast('تم نشر الإشعار.')}
FM.save();FM.refresh()}};
/* حقول إضافية في نموذج المحتوى */
new MutationObserver(()=>{const f=$('#fm-admin-item-form');if(!f||$('.fx-extra',f))return;const x=S().items.find(i=>i.id===f.dataset.editId)||{},g=$('.form-grid',f);if(g)g.insertAdjacentHTML('beforeend',`<div class="field fx-extra"><label>السنة أو التاريخ (للإنجازات والرحلة)</label><input name="x_year" maxlength="40" value="${esc(x.x_year||'')}"></div><div class="field fx-extra"><label>رابط الملف أو الشهادة (https)</label><input name="x_url" dir="ltr" maxlength="500" placeholder="https://" value="${esc(x.x_url||'')}"></div><div class="field fx-extra wide"><label>ملف للمكتبة (حتى 600 كيلوبايت)</label><input type="file" data-fx-file accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip,image/*"><input type="hidden" name="x_data"><input type="hidden" name="x_fname">${x.x_data?`<label class="check"><input type="checkbox" name="x_rm"> حذف الملف الحالي (${esc(x.x_fname||'')})</label>`:''}</div>`)}).observe($('#modal-body'),{childList:true});
})();
